{% if not user.is_authenticated %}
<div
  class="auth-modal"
  data-auth-modal
  hidden
  aria-hidden="true"
>
  <div class="auth-modal__backdrop" data-auth-modal-close></div>
  <section class="auth-modal__panel glass" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <button type="button" class="icon-btn auth-modal__close" data-auth-modal-close aria-label="Close authentication dialog">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <p class="auth-modal__eyebrow">CA-Tech Account</p>
    <h2 id="authModalTitle">Sign in to continue</h2>
    <p class="auth-modal__copy">Save your cart, track orders, and access exclusive deals.</p>

    <!-- ── Real Google OAuth2 button ── -->
    {% if google_oauth_enabled %}
    <a
      href="{% url 'accounts:google_oauth_init' %}?next={{ request.get_full_path|urlencode }}"
      class="auth-modal__google-btn"
      id="modalGoogleBtn"
    >
      <svg class="modal-g-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      <span>Continue with Google</span>
    </a>
    <div class="auth-modal__divider"><span></span><em>or</em><span></span></div>
    {% endif %}

    <!-- ── Login / Register links ── -->
    <div class="auth-modal__actions">
      <a class="primary-btn ripple" href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </a>
      <a class="ghost-btn ripple" href="{% url 'accounts:register' %}?next={{ request.get_full_path|urlencode }}">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </a>
      <button class="ghost-btn ripple" type="button" data-auth-modal-close>Cancel</button>
    </div>
  </section>
</div>

<style>
.auth-modal__google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 0.7rem 1rem;
  border: 2px solid #dadce0;
  border-radius: 10px;
  background: #fff;
  color: #3c4043;
  font-family: "Google Sans", "Roboto", inherit;
  font-size: 0.93rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  margin: 0.8rem 0 0;
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.12s;
}
[data-theme="dark"] .auth-modal__google-btn {
  background: #303134;
  color: #e8eaed;
  border-color: #5f6368;
}
.auth-modal__google-btn:hover {
  border-color: #4285f4;
  box-shadow: 0 2px 12px rgba(66,133,244,0.22);
  transform: translateY(-1px);
  text-decoration: none;
  color: #3c4043;
}
[data-theme="dark"] .auth-modal__google-btn:hover { color: #e8eaed; }
.auth-modal__google-btn:active { transform: translateY(0); }
.modal-g-icon { width: 18px; height: 18px; flex-shrink: 0; }

.auth-modal__divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 1rem 0 0.6rem;
}
.auth-modal__divider span {
  flex: 1;
  height: 1px;
  background: var(--line);
}
.auth-modal__divider em {
  font-style: normal;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
</style>
{% endif %}
